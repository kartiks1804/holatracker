<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#0d9488">

<link rel="stylesheet" href="./styles.css">
<script>(function(){try{var t=localStorage.getItem('pct-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}}catch(e){}})();</script>

      <span class="logo-mark" aria-hidden="true">◈</span>

    <nav aria-label="Primary">
      <div class="nav-label">Workspace</div>
      <a data-nav href="#/"><span class="nav-ic" aria-hidden="true">◈</span>Home</a>
